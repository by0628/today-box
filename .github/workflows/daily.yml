name: 每天更新数据

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-daily.mjs

      - name: 提交
        run: |
          git config user.name "today-box"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily.json
          git diff --staged --quiet || git commit -m "更新每日数据"
          git push
